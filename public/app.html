<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>校送 · H5 骨架</title>
<style>
  :root{
    --brand:#00b964; --brand-600:#00a258;
    --bg:#f4f6f8; --surface:#ffffff;
    --border:#e4e7eb; --text:#1f2329; --text-muted:#646a73;
    --radius:8px; --radius-card:12px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  /* 手机框架：模拟移动端，居中限宽 */
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:64px}
  /* 顶部栏 */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;font-weight:700;font-size:17px;position:sticky;top:0;z-index:10}
  /* 内容区 */
  .view{padding:16px;display:none}
  .view.active{display:block}
  /* 占位卡 */
  .placeholder{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-card);padding:32px 16px;text-align:center;color:var(--text-muted)}
  .placeholder .tag{display:inline-block;background:#fff8e1;color:#b07b00;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px}
  /* 卡片 */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:15px}
  .card .meta{color:var(--text-muted);font-size:12px}
  /* 按钮 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:var(--radius);font-size:14px;cursor:pointer;width:100%;font-weight:500}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.small{width:auto;padding:6px 12px;font-size:12px}
  /* 底部 tab */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;height:56px;z-index:20}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-muted);cursor:pointer;font-size:11px;text-decoration:none}
  .tab .icon{font-size:18px}
  .tab.active{color:var(--brand)}
  /* 输入 */
  .input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
  /* 状态徽章 */
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#eef3ff;color:#4d7cff}
  .badge.warn{background:#fff8e1;color:#b07b00}
  .badge.danger{background:#fdeef0;color:#c43b30}
  .badge.ok{background:#e8f8f0;color:#00a258}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbarTitle">校送</div>

  <!-- 首页 -->
  <section class="view active" id="view-home">
    <div class="placeholder">
      <span class="tag">TODO · 首页</span>
      <div>附近订单 / 我的接单 / 推荐位</div>
      <div style="margin-top:12px;font-size:12px">调 GET /api/orders 拉取可接订单列表</div>
    </div>
    <div style="margin-top:12px">
      <button class="btn primary" onclick="location.hash='#/publish'">立即发单</button>
    </div>
  </section>

  <!-- 订单 -->
  <section class="view" id="view-orders">
    <div class="placeholder">
      <span class="tag">TODO · 订单列表</span>
      <div>我的发单 / 我的接单 / 全部</div>
      <div style="margin-top:12px;font-size:12px">调 GET /api/orders 拉取</div>
    </div>
  </section>

  <!-- 发单 -->
  <section class="view" id="view-publish">
    <div class="card">
      <h3>发布代取需求</h3>
      <div class="field">
        <label>类型</label>
        <select class="input" id="f-type">
          <option value="takeout">外卖</option>
          <option value="parcel">包裹</option>
        </select>
      </div>
      <div class="field">
        <label>取货地点</label>
        <input class="input" id="f-pickup" placeholder="例：东门外卖柜" />
      </div>
      <div class="field">
        <label>送达地点</label>
        <input class="input" id="f-deliver" placeholder="例：5 号楼 302" />
      </div>
      <div class="field">
        <label>备注</label>
        <input class="input" id="f-note" placeholder="选填" />
      </div>
      <button class="btn primary" onclick="createOrder()">提交订单（¥1.5）</button>
    </div>
  </section>

  <!-- 我的 -->
  <section class="view" id="view-me">
    <div class="card">
      <h3>我的</h3>
      <div class="meta">身份：未登录</div>
      <div class="meta">信誉分：—</div>
      <div style="margin-top:12px">
        <button class="btn small" onclick="location.hash='#/register'">注册 / 准入</button>
      </div>
    </div>
  </section>

  <!-- 注册 -->
  <section class="view" id="view-register">
    <div class="card">
      <h3>注册（M1 准入）</h3>
      <div class="field"><label>角色</label>
        <select class="input" id="r-role"><option value="picker">帮取人</option><option value="customer">顾客</option></select>
      </div>
      <div class="field"><label>姓名</label><input class="input" id="r-name" /></div>
      <div class="field"><label>学号</label><input class="input" id="r-sid" /></div>
      <div class="field"><label>手机号</label><input class="input" id="r-phone" /></div>
      <button class="btn primary" onclick="register()">注册</button>
      <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">注册后流程：人脸核验 → 交保证金（¥50）→ 签到</div>
    </div>
  </section>

  <!-- 底部 tab -->
  <nav class="tabbar">
    <a class="tab active" href="#/home"><span class="icon">🏠</span>首页</a>
    <a class="tab" href="#/orders"><span class="icon">📦</span>订单</a>
    <a class="tab" href="#/publish"><span class="icon">➕</span>发单</a>
    <a class="tab" href="#/me"><span class="icon">👤</span>我的</a>
  </nav>
</div>

<script>
/* ===== API 封装层（对接 CONTRACT.md 的 21 个端点）===== */
const API_BASE = '/api';
async function call(method, path, body) {
  const opt = { method, headers: {'Content-Type':'application/json'} };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API_BASE + path, opt);
  const data = await r.json().catch(() => ({}));
  if (!data.ok) throw { code: data.error?.code, message: data.error?.message || '请求失败' };
  return data.data;
}
const api = {
  // M1 准入
  register: (b) => call('POST', '/users/register', b),
  verifyFace: (id) => call('POST', `/users/${id}/verify-face`),
  payDeposit: (id) => call('POST', `/users/${id}/pay-deposit`),
  checkin: (id) => call('POST', `/users/${id}/checkin`),
  // M2 订单
  createOrder: (b) => call('POST', '/orders', b),
  payOrder: (id) => call('POST', `/orders/${id}/pay`),
  accept: (id) => call('POST', `/orders/${id}/accept`),
  pickup: (id, b) => call('POST', `/orders/${id}/pickup`, b),
  deliver: (id) => call('POST', `/orders/${id}/deliver`),
  arrive: (id) => call('POST', `/orders/${id}/arrive`),
  confirm: (id) => call('POST', `/orders/${id}/confirm`),
  rate: (id, b) => call('POST', `/orders/${id}/rate`, b),
  cancel: (id) => call('POST', `/orders/${id}/cancel`),
  getOrder: (id) => call('GET', `/orders/${id}`),
  listOrders: () => call('GET', '/orders'),
  // M5 治理
  getStats: () => call('GET', '/admin/stats'),
};

/* ===== 简易 hash 路由 ===== */
const routes = {
  home: 'view-home', orders: 'view-orders', publish: 'view-publish',
  me: 'view-me', register: 'view-register'
};
const titles = { home:'校送', orders:'我的订单', publish:'发单', me:'我的', register:'注册' };
function router() {
  const path = (location.hash || '#/home').slice(2);
  const key = path.split('/')[0];
  const view = routes[key] || routes.home;
  Object.values(routes).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.getElementById('topbarTitle').textContent = titles[key] || '校送';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector(`.tab[href="#/${key}"]`);
  if (tab) tab.classList.add('active');
}
window.addEventListener('hashchange', router);

/* ===== 页面动作（骨架占位，调 API 后填 UI）===== */
async function register() {
  const body = {
    role: document.getElementById('r-role').value,
    name: document.getElementById('r-name').value,
    studentId: document.getElementById('r-sid').value,
    phone: document.getElementById('r-phone').value
  };
  try { const u = await api.register(body); alert('注册成功：' + JSON.stringify(u)); }
  catch (e) { alert('失败：' + e.message); }
}
async function createOrder() {
  const body = {
    type: document.getElementById('f-type').value,
    pickupLocation: document.getElementById('f-pickup').value,
    deliveryLocation: document.getElementById('f-deliver').value,
    note: document.getElementById('f-note').value,
    customerId: 'TODO' // TODO：从登录态拿
  };
  try { const o = await api.createOrder(body); alert('发单成功：' + JSON.stringify(o)); location.hash='#/orders'; }
  catch (e) { alert('失败：' + e.message); }
}

router();
</script>
</body>
</html>
